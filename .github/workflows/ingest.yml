name: Ingest

on:
  schedule:
    - cron: "15 3 * * *" # daily, 03:15 UTC
  workflow_dispatch:
    inputs:
      source:
        description: "Only this source (lmarena | epoch | openrouter); empty = all enabled"
        required: false
        default: ""
      backfill:
        description: "Backfill the full LMArena history instead of the latest snapshot"
        type: boolean
        default: false

concurrency:
  group: ingest # never two writers at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL secret is not set"; exit 1; fi

      - name: Migrate
        run: pnpm db:migrate

      # fetch → parse → match → validate → compute → write. HTTP calls already retry with
      # backoff; the whole run is retried up to 3 times (snapshots are content-hashed, so
      # re-running is idempotent). A failed source makes the job fail.
      - name: Run pipeline
        env:
          SOURCE: ${{ github.event.inputs.source }}
          BACKFILL: ${{ github.event.inputs.backfill }}
        run: |
          if [ "$BACKFILL" = "true" ]; then
            cmd=(pnpm pipeline backfill lmarena)
          elif [ -n "$SOURCE" ]; then
            cmd=(pnpm pipeline run --source "$SOURCE")
          else
            cmd=(pnpm pipeline run)
          fi
          for attempt in 1 2 3; do
            if "${cmd[@]}"; then exit 0; fi
            echo "::warning::pipeline attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 120))
          done
          exit 1

      - name: Revalidate site
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$REVALIDATE_SECRET" ]; then
            echo "::warning::SITE_URL / REVALIDATE_SECRET not set; skipping revalidation"
            exit 0
          fi
          curl -fsS --retry 4 --retry-delay 10 --retry-all-errors -X POST "${SITE_URL%/}/api/revalidate" \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" -H "content-type: application/json" \
            -d '{"tags":["db"],"paths":["/"]}'

      - name: Upload review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-queue
          path: pipeline/out/review.json
          if-no-files-found: ignore

      - name: Telegram failure alert
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="❌ ai-leaderboard ingest failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
