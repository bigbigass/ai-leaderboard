# Canonical models + per-source aliases. THIS FILE IS THE ONLY WAY A RAW NAME GETS MATCHED.
#
# Rules (ARCHITECTURE §2.4):
#   * Same weights = same model. Different weights = different model (deepseek-r1 ≠ deepseek-v3).
#   * Thinking/reasoning toggles, style control, quantization, provider = a *variant* of the same
#     model: put it in `variant` (keys: reasoning=on|off|high|low|medium, style_control=on|off,
#     quant=…, provider=…; join with ';').
#   * Slug: {family}-{version}[-{size}][-{date}], lowercase, hyphens, no vendor prefix, no preview/exp/latest.
#   * Matching is exact or normalized-exact (case/whitespace/punctuation) against these aliases only.
#     The model slug itself is implicitly an alias for every source.
#   * Fuzzy suggestions land in the review queue (`pnpm pipeline review`); approve by adding a line here,
#     then run `pnpm pipeline rematch`.
#
# source ids: lmarena | epoch | openrouter | livebench | opencompass | superclue | "*" (any)

